plugins {
    id 'com.android.application'
}
android {
    namespace 'com.hamse.loader'
    compileSdk 34
    defaultConfig {
        applicationId "com.hamse.loader"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
